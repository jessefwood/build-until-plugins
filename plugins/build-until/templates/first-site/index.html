<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<meta name="description" content="{{ONE_LINE}}">
<style>
  :root { --bg: #fbfaf8; --ink: #1b1b1b; --muted: #5d5d5d; --accent: #b4532a; --line: #e7e2dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --ink: #f2f0ed; --muted: #b5b0aa; --accent: #e07a4f; --line: #2b2b2b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 72px 20px 48px; }
  .tag { display: inline-block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 12px 0 16px; }
  p.lead { font-size: 19px; color: var(--muted); margin: 0 0 32px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  footer { max-width: 680px; margin: 0 auto; padding: 24px 20px 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="tag">Coming soon</span>
  <h1>{{NAME}}</h1>
  <p class="lead">{{ONE_LINE}}</p>
  <div class="card">
    <strong>My site is being built.</strong>
    <p style="margin:.4em 0 0">This is my first page, live on {{DATE}}. The full site is on its way.</p>
  </div>
</main>
<footer>&copy; <span id="y"></span> {{NAME}}</footer>
<script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
